<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Танк</title>
    <style>
        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 1000px;
            width: 1000px;
            margin: 0;
           
        }
        .car_top {
            position: absolute;
            display: flex;
            width: 330px;
            flex-direction: column;
            top: 285px;  
            align-items: center;  
        }
        .red_line {
            position: absolute;
            background-color: #ff0000;
            display: flex;
            width: 330px; 
            height: 10px;
            border-radius: 5px;
            top: 40px;
        }
        .cover {
            position: absolute;
            top: 15px;
            background-color: #847e7e;
            display: flex;
            width: 200px; 
            height: 40px;
            border-radius: 150px/50px;
        }
        .cover::before{
            content: "";
            position: absolute;
            top: 0px;
            left: 10px;
            background-color: #847e7e;
            width: 250px;
            height: 70px;
            border-radius: 250px/50px;
        }

        .cover::after{
            content: "";
            position: absolute;
            top: 0px;
            left: -60px;
            background-color: #847e7e;
            width: 200px;
            height: 70px;
            border-radius: 100px/100px;

        }
        

        .car {
            position: absolute;
            top: 335px;
            width: 320px;
            height: 80px;
            background-color: #f45a3b;
            border-radius: 0px 0px 15px 15px;
            display: flex;
            justify-content: center;
        }

        .car_bottom {
            position: relative;
            width: 300px;
            height: 60px;
            display: flex;
            top: 80px;
            display: flex;
            flex-direction: column;
        }
        .bottom_part1 {
            border-left: 5px solid transparent;
            border-right: 5px solid transparent;
            border-bottom: 5px solid #222222;
        }
        .bottom_part2 {
            background-color: #222222;
            width: 300px;
            height: 30px;
            display: flex;
        
        }
        .bottom_part3 {
            border-left: 45px solid transparent;
            border-right: 45px solid transparent;
            border-top: 35px solid #222222;
        }
        /* #f45a3b, #000000, #d8d8d8, #ff0000, #999999, #666666, #222222, #ffffff. */
        .wheels {
            position: absolute;
            bottom: -95px;
            left: 50%;
            transform: translateX(-50%);
            width: 290px;
            height: 75px;
            display: flex;
            justify-content: space-between;
        }

        .wheel {
            width: 75px;
            height: 75px;
            background-color: #000000;
            border-radius: 50%;
        }

        .flag {
            position: absolute;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 50px;
            background-color: #808080;
        }

        .flag::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 0;
            width: 20px;
            height: 20px;
            background-color: #ff0000;
            transform: rotate(45deg);
        }
    </style>
</head>
<body>
    <div class="car_top">
        <div class="cover"></div>
        <div class="red_line"></div>
    </div>
    <div class="car">
        <div class="flag"></div>
        <div class="car_bottom">
            <div class="bottom_part1"></div>
            <div class="bottom_part2"></div>
            <div class="bottom_part3"></div>
        </div>
        <div class="wheels">
            <div class="wheel"></div>
            <div class="wheel"></div>
            <div class="wheel"></div>
        </div>
    </div>
</body>
</html>
